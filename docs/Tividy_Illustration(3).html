<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIVIDY – admin and dashboards</title>
<style>
:root{--bg:#f3f6f8;--surface:#fff;--ink:#17212b;--muted:#5d6b78;--line:#d6dee5;--accent:#0f7c86;--accent-ink:#fff;--done:#2f855a;--warn:#b7791f;--sel:#e6f2f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--surface:#18212a;--ink:#e6edf3;--muted:#98a6b3;--line:#2b3844;--accent:#3cb4bf;--accent-ink:#06191b;--done:#5fc58b;--warn:#e0a94f;--sel:#173238;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161c;--surface:#18212a;--ink:#e6edf3;--muted:#98a6b3;--line:#2b3844;--accent:#3cb4bf;--accent-ink:#06191b;--done:#5fc58b;--warn:#e0a94f;--sel:#173238;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:18px 0 6px}
.badge{font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{padding:8px 16px}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:16px}
@media (max-width:780px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel+.panel{margin-top:16px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.add{display:flex;gap:8px;margin-bottom:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;border:1px solid transparent}
.item.wf{cursor:pointer}
.item.wf:hover{background:var(--bg)}
.item.sel{background:var(--sel);border-color:var(--accent)}
small,.meta{color:var(--muted)}
.meta{font-size:13px}
.x{border:0;background:transparent;color:var(--muted);padding:2px 8px;font-size:18px;line-height:1}
.i{width:20px;height:20px;padding:0;border-radius:50%;font-size:12px;font-style:italic;font-family:Georgia,serif;font-weight:700;line-height:1;color:var(--accent);border-color:var(--accent);background:transparent;vertical-align:middle;margin-left:6px}
#tip{position:absolute;z-index:20;width:284px;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#tip hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.form{display:grid;grid-template-columns:2fr 1.2fr 1fr 1.3fr auto;gap:8px}
@media (max-width:780px){.form{grid-template-columns:minmax(0,1fr)}}
.task{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.task .t{flex:1;min-width:150px}
.task select{width:auto;max-width:150px}
.task.st-done .n{text-decoration:line-through;color:var(--muted)}
.task.prio{border-left:3px solid var(--accent);padding-left:8px}
.sub{margin-left:20px;padding-left:10px;border-left:2px solid var(--line)}
.flag{padding:4px 9px;font-size:13px}
.flag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);margin-left:6px;color:var(--muted);white-space:nowrap;font-weight:400}
.tag.st-doing,.tag.pri{color:var(--accent);border-color:var(--accent)}
.tag.st-done{color:var(--done);border-color:var(--done)}
.tag.late,.tag.soon{color:var(--warn);border-color:var(--warn)}
.empty{color:var(--muted);padding:10px 0}
.snapbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.snap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert{border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:14px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.who select{max-width:240px}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.item select{width:auto;max-width:170px;padding:3px 6px;font-size:13px}
.item input{flex:1;min-width:0;padding:3px 6px;font-size:13px}
.lvl{font-size:12px;font-weight:700;color:var(--accent);min-width:26px}
.add select{width:auto;max-width:140px}
.req{border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin:10px 0}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.role{font-size:12px;padding:2px 10px;border-radius:10px;border:1px solid var(--accent);color:var(--accent)}
.hide{display:none}
.task.st-cancelled .n{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:auto}
table.def{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.def th,table.def td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.form2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.hist{max-height:170px;overflow:auto;font-size:13px;margin-top:8px;color:var(--muted)}
.hist .no{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <h1>TIVIDY <span class="badge">Admin</span></h1>
  <div class="tabs">
    <button class="tab" data-view="a">Admin</button>
    <button class="tab" data-view="d">Person dashboards</button>
  </div>

  <div id="viewA" class="grid">
    <div>
      <div class="panel">
        <h2>Workflows <button class="i" data-pat="root,definition" aria-label="Design pattern info">i</button></h2>
        <div class="add"><input id="wfName" placeholder="New workflow name" aria-label="Workflow name"><button class="primary" id="wfAdd">Create</button></div>
        <div id="wfList"></div>
      </div>
    </div>
    <div class="panel" id="main"></div>
  </div>

  <div id="viewD" class="panel hide">
    <div class="who"><div class="av" id="av">?</div><select id="asSel" aria-label="View as person"></select><span class="role" id="roleTag"></span></div>
    <div id="dash"></div>
  </div>
</div>
<div id="tip" class="hide" role="tooltip"></div>

<script>
var KEY = "tividy-admin-v2";
var state = { workflows: [], selected: null, nid: 1, view: "a", as: null, requests: [] };
var LABEL = { todo: "To do", doing: "In progress", done: "Done", cancelled: "Cancelled" };
function closed(x) { return x === "done" || x === "cancelled"; }
/* Role = level (authority number, compared) + name (label only, never compared). Level 0 is the automated system.
   Each workflow keeps its own list of Roles (w.roles) and its own participants (w.people). */
function wfById(id) { return state.workflows.filter(function (x) { return x.id === id; })[0]; }
function maxLevel(w) { return (w.roles || []).reduce(function (m, r) { return Math.max(m, r.level); }, 0); }
function roleName(w, lv) { if (lv === 0) return "Automated System"; var r = ((w && w.roles) || []).filter(function (x) { return x.level === lv; })[0]; return r ? r.name : "Level " + lv; }
function rname(p) { return roleName(wfById(p.wf), p.role || 1); }
function allPeople() { var a = []; state.workflows.forEach(function (w) { a = a.concat(w.people); }); return a; }
var PAT = {
  builder: { n: "Builder + Factory Method", b: "When an instance enters a status, HumanTaskCreator.createTask() (Factory Method) has ProcessDirector drive a HumanTaskBuilder (setName, setAssignee, setDueDate, getResult) to produce each HumanTask." },
  composite: { n: "Composite", b: "A row with parallel tasks becomes a TaskComposite (the action) holding one HumanTask per sub-step, all handled as TaskComponent. It is Done only when every child is, and that is what moves the workflow on." },
  state: { n: "State", b: "TaskStates with TodoState, InProgressState, DoneState and CancelledState drive each task's tag and dropdown. Cancelling an instance, or choosing one of several actions, moves the other open tasks to CancelledState." },
  decorator: { n: "Decorator", b: "PriorityConfiguration wraps a task to add priority, DueSoonDecorator adds the due-soon flag, and ApprovalPendingDecorator marks a task locked while an approval request is pending." },
  iter1: { n: "Iterator: DueDateIterator", b: "Walks a person’s tasks from earliest to latest due date without exposing the list. Priority tasks are walked first." },
  iter2: { n: "Iterator: PendingTaskIterator", b: "Walks only the open leaf tasks of a workflow (skipping closed ones and composite parents). Its count decides whether Save snapshot unlocks." },
  memento: { n: "Memento", b: "WorkflowSnapshot captures the workflow’s tasks and instances, and SnapshotHistory (saveSnapshot, restoreSnapshot) keeps them so an earlier one can be restored." },
  observer: { n: "Observer", b: "DeadlineMonitor.checkDeadlines() finds overdue tasks and calls notifyOverdue on its DeadlineObservers. Here the escalation observer moves the task up one role. The dashboard banner is another observer." },
  strategy: { n: "AssignmentRule (Strategy)", b: "LeastLoadedAssignment picks the least busy person at one level of the workflow\u2019s own hierarchy. RoleBasedAssignment starts at the lowest level the row needs and walks up to that workflow\u2019s top level. Used when a task is created, for escalation and for approval requests." },
  chain: { n: "Chain of Responsibility", b: "An ApprovalRequest travels through one RoleTierHandler per level of the workflow\u2019s hierarchy (level 2 up to its top level), then a FallbackHandler that rejects it. The chain is built from the workflow\u2019s levels, so a workflow with 2 levels gets a short chain and one with 5 gets a long one. Whoever accepts is assigned the task." },
  hierarchy: { n: "Role + participants (workflow-defined)", b: "A Role is a level number plus a display name. Only the number is compared; the name is a label. Each workflow definition holds its own list of Roles and its own participants, so one workflow can be Clerk, Manager and another Officer, Reviewer, Registrar, Dean. Level 0 is always the automated system." },
  definition: { n: "WorkflowDefinition", b: "The process map plus the hierarchy of levels it uses. Both are plain data, so each industry supplies its own statuses and role names and the engine never changes." },
  instance: { n: "WorkflowInstance + WorkflowEngine", b: "A WorkflowInstance holds one case's status, flag and audit log. WorkflowEngine owns the active instances and drives them." },
  root: { n: "WorkflowEngine", b: "A workflow here is a definition plus the WorkflowInstances the engine runs from it." }
};

/* ---------- Iterators ---------- */
function DueDateIterator(items, key) {
  this.a = items.slice().sort(function (x, y) { var p = key(x) || "9999", q = key(y) || "9999"; return p < q ? -1 : p > q ? 1 : 0; });
  this.i = 0;
}
function PendingTaskIterator(w) {
  this.a = w.tasks.filter(function (t) { return !hasKids(w, t.id) && !closed(st(w, t)); });
  this.i = 0;
}
DueDateIterator.prototype.hasNext = PendingTaskIterator.prototype.hasNext = function () { return this.i < this.a.length; };
DueDateIterator.prototype.next = PendingTaskIterator.prototype.next = function () { return this.a[this.i++]; };
function drain(it) { var r = []; while (it.hasNext()) r.push(it.next()); return r; }

/* ---------- Chain of Responsibility ---------- */
function lvOpts(w, sel, withAuto) {
  var ks = (withAuto ? [0] : []).concat((w.roles || []).map(function (r) { return r.level; }).sort(function (a, b) { return a - b; }));
  return ks.map(function (k) { return '<option value="' + k + '"' + (k === sel ? " selected" : "") + ">" + esc(roleName(w, k)) + (k ? " (L" + k + ")" : "") + "</option>"; }).join("");
}
function pRoleOpts(w, sel) { return lvOpts(w, sel, false); }
function dRoleOpts(w, sel) { return lvOpts(w, sel, true); }
function openCount(id) {
  var n = 0;
  state.workflows.forEach(function (w) { w.tasks.forEach(function (t) { if (t.who === id && !closed(st(w, t))) n++; }); });
  return n;
}
function leastLoaded(w, level, exceptId) {
  var c = w.people.filter(function (p) { return (p.role || 1) === level && p.id !== exceptId; });
  c.sort(function (a, b) { return openCount(a.id) - openCount(b.id) || a.id - b.id; });
  return c[0] || null;
}
/* One RoleTierHandler per level of the workflow's own hierarchy, then a FallbackHandler. */
function RoleTierHandler(w, level) { this.w = w; this.level = level; this.next = null; }
RoleTierHandler.prototype.handle = function (req) {
  if (this.level > req.level) {
    var p = leastLoaded(this.w, this.level, req.from);
    if (p) { req.to = p.id; req.level = this.level; req.status = "pending"; return req; }
  }
  return this.next.handle(req);
};
function FallbackHandler() {}
FallbackHandler.prototype.handle = function (req) { req.status = "rejected"; req.to = null; return req; };
function chainFor(w) {
  var head = new FallbackHandler();
  for (var lv = maxLevel(w); lv >= 2; lv--) { var h = new RoleTierHandler(w, lv); h.next = head; head = h; }
  return head;
}

function requestApproval(wid, tid) {
  var w = state.workflows.filter(function (x) { return x.id === wid; })[0], t = w && byId(w, tid), me = t && person(t.who);
  if (!t || !me) return;
  var busy = state.requests.some(function (r) { return r.wf === wid && r.task === tid && r.status === "pending"; });
  if (busy) return;
  var req = { id: state.nid++, wf: wid, task: tid, from: me.id, to: null, level: me.role || 1, status: "pending", trail: [], reqRole: t.reqRole };
  chainFor(w).handle(req);
  state.requests.push(req);
  save(); render();
}
function resolveRequest(id, action) {
  var r = state.requests.filter(function (x) { return x.id === id; })[0];
  if (!r || r.status !== "pending") return;
  var w = state.workflows.filter(function (x) { return x.id === r.wf; })[0], t = w && byId(w, r.task);
  if (!t) r.status = "cancelled";
  else if (action === "accept") { t.who = r.to; r.status = "accepted"; }
  else { r.trail.push(r.to); chainFor(w).handle(r); }
  save(); render();
}
function reqBtn(w, t, s) {
  var me = person(t.who);
  if (closed(s) || !me) return "";
  var hasAuth = (me.role || 1) >= (t.reqRole || 1);
  if (hasAuth) return ""; 
  var pend = state.requests.some(function (r) { return r.wf === w.id && r.task === t.id && r.status === "pending"; });
  return pend ? '<span class="tag soon">Approval requested</span>' : '<button class="flag" data-req="' + w.id + ':' + t.id + '">Request approval</button>';
}
function requestsHtml() {
  var me = state.as, pObj = person(me), h = "", oh = "";
  function ref(r) { var w = state.workflows.filter(function (x) { return x.id === r.wf; })[0], t = w && byId(w, r.task); return t ? { w: w, t: t } : null; }
  state.requests.filter(function (r) { return r.status === "pending" && r.to === me; }).forEach(function (r) {
    var x = ref(r);
    if (!x) return;
    var hasAuth = (pObj.role || 1) >= (r.reqRole || 1);
    var higher = x.w.people.some(function (p) { return (p.role || 1) > (pObj.role || 1); });
    h += '<div class="req"><div><b>' + esc(pName(r.from)) + '</b> asks you to take <b>' + esc(x.t.name) + '</b> <span class="meta">(' + esc(x.w.name) + (x.t.due ? ', due ' + esc(x.t.due) : '') + ') - Needs ' + esc(roleName(x.w, r.reqRole)) + '</span></div>' +
      (r.trail.length ? '<div class="meta">Passed up by ' + r.trail.map(pName).join(' → ') + '</div>' : '') +
      '<div class="row2">' + (hasAuth ? '<button class="primary" data-acc="' + r.id + '">Accept task</button>' : '') + '<button data-pass="' + r.id + '">' + (higher ? 'Pass up' : 'Decline') + '</button></div></div>';
  });
  state.requests.filter(function (r) { return r.from === me; }).slice(-5).reverse().forEach(function (r) {
    var x = ref(r);
    if (!x) return;
    var to = person(r.to), s = r.status === 'pending' ? 'Waiting on ' + esc(pName(r.to)) + ' (' + esc(roleName(x.w, (to && to.role) || 1)) + ')' : r.status === 'accepted' ? 'Accepted by ' + esc(pName(r.to)) + ', task reassigned' : r.status === 'rejected' ? 'Nobody above could take it' : 'Cancelled';
    oh += '<div class="meta">' + esc(x.t.name) + ' · ' + s + (r.trail.length ? ' · passed up by ' + r.trail.map(pName).join(', ') : '') + '</div>';
  });
  return '<h3>Requests ' + info('chain') + '</h3>' + (h || oh ? h + (oh ? '<div class="meta"><b>Your requests</b></div>' + oh : '') : '<div class="empty">No requests.</div>');
}

/* ---------- Helpers ---------- */
function load() {
  try {
    var r = localStorage.getItem(KEY);
    if (r) { var s = JSON.parse(r); if (s && Array.isArray(s.workflows)) { state = s; state.requests = state.requests || []; state.workflows.forEach(function (w) { w.roles = w.roles || []; w.people = w.people || []; w.tasks = w.tasks || []; }); } }
  } catch (e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function info(keys) { return '<button class="i" data-pat="' + keys + '" aria-label="Design pattern info">i</button>'; }
function current() { return state.workflows.filter(function (w) { return w.id === state.selected; })[0]; }
function person(id) { return allPeople().filter(function (p) { return p.id === id; })[0]; }
function pName(id) { var p = person(id); return p ? p.name : "Unassigned"; }
function byId(w, id) { return w.tasks.filter(function (t) { return t.id === id; })[0]; }
function kidsOf(w, id) { return w.tasks.filter(function (t) { return t.parent === id; }); }
function hasKids(w, id) { return kidsOf(w, id).length > 0; }
function leaves(w) { return w.tasks.filter(function (t) { return !hasKids(w, t.id); }); }
function st(w, t) {
  var k = kidsOf(w, t.id);
  if (!k.length) return t.status;
  var c = k.map(function (x) { return st(w, x); });
  if (c.every(function (x) { return x === "cancelled"; })) return "cancelled";
  if (c.every(closed)) return "done";
  if (c.some(function (x) { return x !== "todo"; })) return "doing";
  return "todo";
}
function dayDiff(due) { var m = new Date(); m.setHours(0, 0, 0, 0); return Math.round((new Date(due + "T00:00:00") - m) / 864e5); }
function isLate(s, t) { return !closed(s) && t.due && dayDiff(t.due) < 0; }
function tags(t, s) {
  var h = '<span class="tag st-' + s + '">' + LABEL[s] + "</span>";
  if (t.priority) h += '<span class="tag pri">Priority</span>';
  if (!closed(s) && t.due) { var d = dayDiff(t.due); if (d < 0) h += '<span class="tag late">overdue</span>'; else if (d <= 2) h += '<span class="tag soon">due soon</span>'; }
  return h;
}

/* ---------- Admin view ---------- */
function renderWorkflows() {
  $("wfList").innerHTML = state.workflows.length ? state.workflows.map(function (w) {
    var lv = leaves(w).length, left = drain(new PendingTaskIterator(w)).length;
    return '<div class="item wf' + (w.id === state.selected ? " sel" : "") + '" data-sel="' + w.id + '"><span>' + esc(w.name) + " <small>" + (lv - left) + "/" + lv + '</small></span><button class="x" data-delw="' + w.id + '" aria-label="Delete workflow">×</button></div>';
  }).join("") : '<div class="empty">No workflows yet. Create one above.</div>';
}
function personOpts(w, sel) {
  return '<option value="">Unassigned</option>' + w.people.map(function (p) { return '<option value="' + p.id + '"' + (p.id === sel ? " selected" : "") + ">" + esc(p.name) + " (" + esc(roleName(w, p.role || 1)) + ")</option>"; }).join("");
}
/* Hierarchy + participants: defined per workflow */
function hierarchyHtml(w) {
  var top = maxLevel(w), lv = w.roles.slice().sort(function (a, b) { return b.level - a.level; });
  var h = "<h3>Participant hierarchy " + info("hierarchy,strategy,chain") + '</h3><div class="meta">This workflow defines its own levels. A higher level has more authority; the name is only a label. Level 0 is always the automated system.</div>';
  h += lv.length ? lv.map(function (r) {
    var n = w.people.filter(function (p) { return p.role === r.level; }).length, used = (w.def || []).some(function (x) { return x.role === r.level; });
    var can = r.level === top && !n && !used, why = r.level !== top ? "Only the top level can be removed" : n ? "People are at this level" : used ? "A process-map row needs this level" : "Remove top level";
    return '<div class="item" style="margin-left:' + Math.min((top - r.level) * 10, 60) + 'px"><span class="lvl">L' + r.level + '</span><input data-lvname="' + r.level + '" value="' + esc(r.name) + '" aria-label="Name of level ' + r.level + '"><small>' + n + ' ' + (n === 1 ? "person" : "people") + '</small><button class="x" data-dellv="' + r.level + '"' + (can ? "" : " disabled") + ' title="' + why + '" aria-label="Remove level">×</button></div>';
  }).join("") : '<div class="empty">No levels yet. Add the lowest level first (for example the people who do the first tasks), then add higher levels above it.</div>';
  h += '<div class="add" style="margin-top:8px"><input id="lvName" placeholder="' + (lv.length ? "New top level, e.g. Team lead" : "Lowest level, e.g. Clerk") + '" aria-label="New level name"><button class="primary" id="lvAdd">Add level</button></div>';

/* Strategy: AssignmentRule (built per workflow, so it only sees that workflow's hierarchy and people) */

/* Builder + Factory Method: HumanTaskCreator -> ProcessDirector -> HumanTaskBuilder */
function HumanTaskBuilder() { this.reset(); }

HumanTaskBuilder.prototype.setName = function (n) { this.task.name = n; return this; };

function ProcessDirector(builder) { this.builder = builder; }
ProcessDirector.prototype.constructTask = function (name, assignee, due) { return this.builder.reset().setName(name).setAssignee(assignee).setDueDate(due).getResult(); };

/* Observer: DeadlineMonitor notifies DeadlineObservers */

  auditRun(w, t.run, "Escalated", "DeadlineMonitor", "'" + t.action + "' overdue, moved from " + pName(t.who) + " to " + p.name + " (" + roleName(w, p.role || 1) + ")");

function DeadlineMonitor() { this.observers = [new EscalationObserver()]; }

  var self = this;

    if (!t.run || hasKids(w, t.id) || closed(t.status) || !t.due || dayDiff(t.due) >= 0 || t.escalated) return;

var monitor = new DeadlineMonitor();

/* Audit log */
function stamp() { return new Date().toLocaleString([], { dateStyle: "short", timeStyle: "medium" }); }
function audit(r, type, by, detail) { r.log = r.log || []; r.log.push({ at: stamp(), type: type, by: by, detail: detail }); }
function runOf(w, id) { return (w.runs || []).filter(function (x) { return x.id === id; })[0]; }

  }).join("") + "</table>" : '<div class="empty">No rows yet. Add one, or load an example.</div>';
  return "<h3>Process map (workflow definition) " + info("definition,composite") + '</h3><div class="meta">Just a table of text, so each industry writes its own statuses. Min. level comes from this workflow\u2019s own hierarchy above. Put a guarded row before its default row. Due = days allowed once the task is created. Parallel tasks = comma-separated sub-tasks that must all finish.</div>' + t +
    '<div class="form2"><input id="dFrom" placeholder="From status" aria-label="From status"><input id="dAct" placeholder="Action" aria-label="Action"><input id="dTo" placeholder="To status" aria-label="To status"><select id="dRole" aria-label="Minimum level">' + dRoleOpts(w, maxLevel(w) ? 1 : 0) + '</select><select id="dGuard" aria-label="When"><option value="any">always</option><option value="flag">only if flagged</option></select><input id="dDays" type="number" placeholder="Due in (days)" aria-label="Due in days"><input id="dSubs" placeholder="Parallel tasks (a, b)" aria-label="Parallel tasks"><button class="primary" id="defAdd">Add row</button></div><div class="row2"><button id="defEx">Load insurance example</button><button id="defEx2">Load admissions example</button></div><div class="meta">An example also sets its own hierarchy of levels.</div>';
}
function who(w, p) { return p ? p.name + " (" + roleName(w, p.role || 1) + ")" : "nobody, no participants in the hierarchy"; }
/* Instance enters a status: create tasks */
function spawn(w, r) {
  var seen = {}, rows = [], assignment = assignmentFor(w);
  w.def.forEach(function (x) { if (x.from === r.status && !seen[x.action]) { seen[x.action] = 1; rows.push(x); } });
  if (!rows.length) { audit(r, "Instance finished", "Engine", "No actions left from '" + r.status + "'"); return; }
  
  var autoTasks = [];
  rows.forEach(function (x) {
    var subs = x.subs || [], due = x.days ? dueIn(x.days) : "", top = creator.createTask(x.action + " (" + r.name + ")", null, "");
    top.run = r.id; top.action = x.action; top.reqRole = x.role; w.tasks.push(top);
    
    if (x.role === 0) {
      top.who = null; 
      top.status = "done";
      audit(r, "Task created", "Engine", "Automated task '" + x.action + "' queued");
      autoTasks.push(top);
      return;
    }

    if (!subs.length) {

    subs.forEach(function (n) {

  });

  autoTasks.forEach(function(t) {

function routeFor(w, r, action) {
  var row = null;

/* A person set a task to Done. A composite fires only when all children are done. */
function taskDone(w, t) {

  var row = routeFor(w, r, top.action);
  var isAuto = row && row.role === 0;
  var why = !row ? "'" + top.action + "' is not allowed from status '" + r.status + "'" :
    (!isAuto && (!me || (me.role || 1) < row.role)) ? "'" + top.action + "' needs " + roleName(w, row.role) + " or above" + (me ? ", " + me.name + " is " + roleName(w, me.role || 1) : ", nobody is assigned") : "";

  if (par) { audit(r, "Subtask done", me.name, "'" + t.action + "' (part of '" + par.action + "')"); if (st(w, par) !== "done") return; }
  if (!isAuto) audit(r, "Task done", me.name, "'" + top.action + "' completed (To do, In progress, Done)");
  audit(r, "Status changed", "Engine", r.status + " → " + row.to + (row.guard === "flag" ? " (guard: flagged)" : ""));
  r.status = row.to;
  top.status = "done";
  var gone = 0;
  w.tasks.forEach(function (x) { if (x.run === r.id && x.id !== top.id && x.parent !== top.id && !closed(x.status)) { x.status = "cancelled"; gone++; } });

}
function checkDeadlines(w) { monitor.checkDeadlines(w); }

function engineClick(w, t) {

  if (t.id === "pAdd") addPerson(w);
  else if (t.id === "lvAdd") addLevel(w);
  else if ((b = t.closest("[data-dellv]"))) {
    var lv = +b.getAttribute("data-dellv");
    if (b.disabled) return true;
    w.roles = w.roles.filter(function (r) { return r.level !== lv; });
    save(); render();
  }
  else if ((b = t.closest("[data-delp]"))) {
    var id = +b.getAttribute("data-delp");
    w.people = w.people.filter(function (p) { return p.id !== id; });
    state.workflows.forEach(function (x) { x.tasks.forEach(function (k) { if (k.who === id) k.who = null; }); });
    state.requests = state.requests.filter(function (r) { return r.from !== id; });
    state.requests.forEach(function (r) { if (r.status === "pending" && r.to === id) { var rw = wfById(r.wf); r.level = Math.max(1, r.level - 1); if (rw) chainFor(rw).handle(r); } });
    save(); render();
  }
  else return false;
  return true;
}
function addWorkflow() {
  var n = $("wfName").value.trim();
  if (!n) { $("wfName").focus(); return; }
  var w = { id: state.nid++, name: n, tasks: [], snaps: [], roles: [], people: [] };
  state.workflows.push(w); state.selected = w.id;
  $("wfName").value = "";
  save(); render();
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
  b.onclick = function () { state.view = b.getAttribute("data-view"); save(); render(); };
});
$("wfAdd").onclick = addWorkflow;
$("wfName").onkeydown = function (e) { if (e.key === "Enter") addWorkflow(); };

$("wfList").onclick = function (e) {
  var d = e.target.closest("[data-delw]");
  if (d) {
    var id = +d.getAttribute("data-delw");
    state.workflows = state.workflows.filter(function (w) { return w.id !== id; });
    if (state.selected === id) state.selected = state.workflows.length ? state.workflows[0].id : null;
    save(); render(); return;
  }
  var s = e.target.closest("[data-sel]");
  if (s) { state.selected = +s.getAttribute("data-sel"); save(); render(); }
};
$("main").onclick = function (e) {
  var w = current(), t = e.target;
  if (!w) return;
  if (hierarchyClick(w, t)) return;
  if (engineClick(w, t)) return;
  if (t.id === "snapBtn" && !t.disabled) {
    w.snaps = w.snaps || [];
    w.snaps.unshift({ at: new Date().toLocaleString([], { dateStyle: "short", timeStyle: "short" }), left: drain(new PendingTaskIterator(w)).length, tasks: JSON.stringify({ tasks: w.tasks, runs: w.runs || [] }) });
    save(); render(); return;
  }
  
  var r = t.closest("[data-restore]");
  if (r) { var sn = JSON.parse(w.snaps[+r.getAttribute("data-restore")].tasks); if (Array.isArray(sn)) w.tasks = sn; else { w.tasks = sn.tasks; w.runs = sn.runs; } save(); render(); return; }
  
  var delSnap = t.closest("[data-delsnap]");
  if (delSnap) { w.snaps.splice(+delSnap.getAttribute("data-delsnap"), 1); save(); render(); return; }
  
  var p = t.closest("[data-pri]");
  if (p) {
    var pid = +p.getAttribute("data-pri");
    w.tasks.forEach(function (x) { if (x.id === pid) x.priority = !x.priority; });
    save(); render(); return;
  }
  var rm = t.closest("[data-rm]");
  if (!rm) return;
  var gone = [+rm.getAttribute("data-rm")];
  for (var i = 0; i < gone.length; i++) w.tasks.forEach(function (x) { if (x.parent === gone[i] && gone.indexOf(x.id) < 0) gone.push(x.id); });
  w.tasks = w.tasks.filter(function (x) { return gone.indexOf(x.id) < 0; });
  save(); render();
};
$("main").onkeydown = function (e) {
  var w = current();
  if (e.key !== "Enter" || !w) return;
  if (e.target.id === "pName") addPerson(w);
  else if (e.target.id === "lvName") addLevel(w);
};
$("main").onchange = function (e) {
  var t = e.target, w = current();
  if (t.getAttribute("data-lvname") && w) {
    var lvn = +t.getAttribute("data-lvname"), nm = t.value.trim();
    if (nm) w.roles.forEach(function (r) { if (r.level === lvn) r.name = nm; });
    save(); render();
  }
  else if (t.getAttribute("data-role") && w) {
    var pid2 = +t.getAttribute("data-role");
    w.people.forEach(function (p) { if (p.id === pid2) p.role = +t.value; });
    save(); render();
  }
  else if (t.getAttribute("data-flag") && w) {
    var fid = +t.getAttribute("data-flag");
    (w.runs || []).forEach(function (x) { if (x.id === fid) { x.flag = t.checked; audit(x, "Data changed", "Admin", "flagged = " + (t.checked ? "yes" : "no")); } });
    save(); render();
  }
  else if (t.getAttribute("data-who") && w) {
    var id = +t.getAttribute("data-who");
    w.tasks.forEach(function (x) { if (x.id === id) { x.who = +t.value || null; if (x.run) auditRun(w, x.run, "Task reassigned", "Admin", "'" + x.action + "' now with " + pName(x.who)); } });
    state.requests.forEach(function (r) { if (r.wf === w.id && r.task === id && r.status === "pending") r.status = "cancelled"; });
    save(); render();
  }
};
$("asSel").onchange = function () { state.as = +$("asSel").value; save(); render(); };
$("dash").onclick = function (e) {
  var q = e.target.closest("[data-req]"), a = e.target.closest("[data-acc]"), p = e.target.closest("[data-pass]");
  if (q) { var ids = q.getAttribute("data-req").split(":"); requestApproval(+ids[0], +ids[1]); }
  else if (a) resolveRequest(+a.getAttribute("data-acc"), "accept");
  else if (p) resolveRequest(+p.getAttribute("data-pass"), "pass");
};
$("dash").onchange = function (e) {
  var id = e.target.getAttribute("data-st"), wid = e.target.getAttribute("data-wf");
  if (!id) return;
  state.workflows.forEach(function (w) {
    if (w.id !== +wid) return;
    var t = byId(w, +id);
    if (!t) return;
    t.status = e.target.value;
    if (t.run && t.status === "doing") auditRun(w, t.run, "Task started", pName(t.who), "'" + t.action + "' is now In progress");
    if (t.run && t.status === "done") taskDone(w, t);
  });
  save(); render();
};

/* Pattern info popover */
document.addEventListener("click", function (e) {
  var b = e.target.closest(".i"), tip = $("tip");
  if (!b) { tip.className = "hide"; return; }
  if (tip.className === "" && tip._for === b) { tip.className = "hide"; return; }
  tip._for = b;
  tip.innerHTML = b.getAttribute("data-pat").split(",").map(function (k) { return "<b>" + PAT[k].n + "</b><br>" + PAT[k].b; }).join("<hr>");
  tip.className = "";
  var r = b.getBoundingClientRect();
  tip.style.top = (r.bottom + window.scrollY + 8) + "px";
  tip.style.left = Math.max(8, Math.min(r.left + window.scrollX - 8, window.innerWidth - 300)) + "px";
});

load();
if (!current() && state.workflows.length) state.selected = state.workflows[0].id;
render();
</script>
</body>
</html>
